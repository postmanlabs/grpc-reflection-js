name: CI

on:
  push:
    branches: 
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node 22
      uses: actions/setup-node@v4
      with:
        node-version: '22.14.0'
    - name: Install packages
      run: npm install
    - name: Run test
      run: npm test
    - name: Coverage report
      run: npm run report
    - name: Upload report
      run: bash <(curl -s https://codecov.io/bash)
