// proto/widgets.proto
syntax = "proto3";

package widgets.v1; // Use a versioned package name

// Represents a widget item
message Widget {
  string id = 1;
  string name = 2;
  string color = 3;
}

// Request to list widgets, optionally filtering by color
message ListWidgetsRequest {
  string filter_color = 1; // Empty string means no filter
}

// Response containing a list of widgets
message ListWidgetsResponse {
  repeated Widget widgets = 1;
}

// Request to create a new widget
message CreateWidgetRequest {
  string name = 1;
  string color = 2;
}

// Response after creating a widget
message CreateWidgetResponse {
  Widget widget = 1;
}

// The Widget service definition
service WidgetService {
  // Lists widgets, optionally filtering by color
  rpc ListWidgets(ListWidgetsRequest) returns (ListWidgetsResponse);

  // Creates a new widget
  rpc CreateWidget(CreateWidgetRequest) returns (CreateWidgetResponse);
}
